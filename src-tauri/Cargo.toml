[package]
name = "glossy"
version = "2.0.0"
description = "Glossy - a lightweight select-to-translate desktop app"
authors = ["Glossy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "glossy_lib"
# Desktop only: a `rlib` is all the binary needs. Adding `cdylib`/`staticlib`
# makes the GNU linker export every symbol and fail with
# "export ordinal too large" on older MinGW binutils.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# The folder a translation is saved into is picked with the system dialog.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
base64 = "0.22"
md-5 = "0.10.6"
# Text is read on the machine itself: the PaddleOCR models run through
# onnxruntime, which is loaded from the runtime the user downloads next to the
# models (see `src/ocr/models.rs`), hence `load-dynamic` and a pinned runtime.
png = "0.17"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
pdf-extract = "0.12"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.39.4"

# The only platform implementation the crate has; `src/platform/windows/` is the
# single place that depends on it (see `src/platform/mod.rs`).
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    # `CreateMutexW` names a `SECURITY_ATTRIBUTES` parameter it never uses here.
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # COM is initialised on the speech worker thread and by the UI Automation
    # sentence reader.
    "Win32_System_Com",
    # The machine identifier the daily allowance is counted by, so that
    # installing the app again lands on the same one.
    "Win32_System_Registry",
    "Win32_System_Threading",
    # `ISpVoice` reads a translation out loud.
    "Win32_Media_Speech",
    # `TextPattern` expands the selected word to the sentence around it.
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
