[package]
name = "glossy"
version = "0.1.0"
description = "Glossy - a lightweight select-to-translate desktop app"
authors = ["Glossy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "glossy_lib"
# Desktop only: a `rlib` is all the binary needs. Adding `cdylib`/`staticlib`
# makes the GNU linker export every symbol and fail with
# "export ordinal too large" on older MinGW binutils.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
md-5 = "0.10.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
