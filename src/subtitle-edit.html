<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glossy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/subtitle-edit.css" />
  </head>
  <body>
    <!-- The two boxes a subtitle reading is made of, drawn where they are now.
         This window covers one monitor and takes the mouse for as long as it is
         up: what is being measured is a rectangle on a screen, and a rectangle
         cannot be dragged by clicking on the video underneath it. -->
    <div class="box" id="area" data-role="area">
      <span class="box-tag" data-i18n="subtitle.box.area">Read from here</span>
    </div>
    <div class="box" id="place" data-role="place">
      <span class="box-tag" data-i18n="subtitle.box.place">Translation goes here</span>
    </div>

    <div class="bar" id="bar">
      <p class="bar-hint" data-i18n="subtitle.edit.hint">
        Drag a box to move it, or its edge to resize it. Esc cancels.
      </p>
      <button type="button" id="cancel" data-i18n="subtitle.edit.cancel">Cancel</button>
      <button type="button" id="apply" data-i18n="subtitle.edit.apply">Use these boxes</button>
    </div>

    <script src="js/bridge.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/subtitle-edit.js"></script>
  </body>
</html>
