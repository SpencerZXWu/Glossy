<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glossy</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <script src="js/theme.js"></script>
  </head>
  <body data-state="loading">
    <div class="card" id="card">
      <header class="bar">
        <div class="grip" id="grip" data-tauri-drag-region="deep">
          <span class="headword" id="headword">Glossy</span>
        </div>
        <button class="icon-button" id="pin" type="button" data-i18n-title="popup.pin" title="Pin the card" aria-pressed="false" aria-label="Pin the card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4h6l-.9 5.4 3.4 3.4V15H7v-2.2l3.4-3.4z" />
            <path d="M12 15v5" />
          </svg>
        </button>
        <button class="icon-button" id="copy" type="button" data-i18n-title="popup.copy" title="Copy translation" aria-label="Copy translation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="12" height="12" rx="2.5" />
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
          </svg>
        </button>
        <button class="icon-button" id="settings" type="button" data-i18n-title="popup.settings" title="Open the settings" aria-label="Open the settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h6M14 8h6M4 16h10M18 16h2" />
            <circle cx="12" cy="8" r="2" />
            <circle cx="16" cy="16" r="2" />
          </svg>
        </button>
      </header>
      <div class="langbar" id="langbar" hidden>
        <select class="lang-select" id="langFrom" data-i18n-title="popup.sourceLang" title="Source language"></select>
        <button class="lang-swap" id="langSwap" type="button" data-i18n-title="popup.swap" title="Swap languages" aria-label="Swap languages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13M14 5l3 3-3 3" />
            <path d="M20 16H7M10 13l-3 3 3 3" />
          </svg>
        </button>
        <select class="lang-select" id="langTo" data-i18n-title="popup.targetLang" title="Target language"></select>
      </div>
      <div class="content" id="content"></div>
    </div>
    <button class="badge" id="badge" type="button" data-i18n-title="popup.translate" title="Translate the selection" aria-label="Translate the selection">
      <img src="images/logo.png" alt="" />
    </button>
    <script src="js/bridge.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/render.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
